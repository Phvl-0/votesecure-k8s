apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: votesecure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/phvl-0/votesecure-fullstack-api:e77d14ace3ef1aef8f68108ca8bbe9a7a8d0b602
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: votesecure-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: votesecure-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              value: postgresql+asyncpg://appuser:$(POSTGRES_PASSWORD)@db:5432/authdb
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
